[project]
name = "zhibiao"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "whuwcm2", email = "215069253@qq.com" }
]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "celery>=5.7.0",
    "chromadb>=1.5.9",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "langchain-core>=1.7.6",
    "langgraph>=1.2.20",
    "langsmith>=0.14.17",
    "openai>=3.46.0",
    "pymupdf>=2.1",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.33",
    "redis>=8.1.0",
    "sqlalchemy[asyncio]>=2.0",
    "uvicorn[standard]>=0.54.0",
    "zai-sdk>=0.2.3",
]

[project.scripts]
zhibiao = "zhibiao.cli:main"

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple/"
default = true

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
